# Reference of the full server stack (source of truth lives on the server).
# This mirrors P'Nott's existing compose (postgres + n8n + cloudflared) with the
# `stock-api` service added. No custom network is defined, so every service joins
# the default compose network and reaches each other by name — n8n calls the API
# at http://stock-api:8000/api/v1/stocks/all.
#
# The server only needs THIS file + a .env; the image (built by CI, pushed to
# GHCR) is self-contained, so the repo does NOT need to be cloned on the server.
# .env must define: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, N8N_HOST,
# WEBHOOK_URL, N8N_ENCRYPTION_KEY, CF_TUNNEL_TOKEN, ANTHROPIC_API_KEY, API_KEY
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=Asia/Bangkok
      - N8N_PROXY_HOPS=1
    volumes:
      - n8n_data:/home/node/.n8n

  # --- added: stock card rendering API (internal-only, reached by n8n) ---
  stock-api:
    image: ghcr.io/siriphonnott/stock-ai-bot:latest
    container_name: stock-api
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - API_KEY=${API_KEY}          # optional shared secret; empty = open
    expose:
      - "8000"                       # internal-only; intentionally NOT published
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - n8n

volumes:
  pg_data:
  n8n_data:
